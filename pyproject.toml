[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hrap"
dynamic = ["version"]
description = "HRAP (HCAT Fork) — Hybrid Rocket Analysis Program with a MATLAB-parity engine and dark-mode desktop UI."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "Robert A. Nickel" },
    { name = "Thomas A. Scott" },
    { name = "Drew Nickel" },
]
dependencies = [
    "numpy",
    "scipy",
    "PySide6",
    "pyqtgraph",
    "coolprop",
]

[project.optional-dependencies]
advanced = [
    "scikit-image",
    "opencv-python",
]
dev = [
    "pytest",
    "ruff",
]
build = [
    "pyinstaller>=6.0",
]

[tool.hatch.version]
path = "src/hrap/__init__.py"

[project.scripts]
hrap = "hrap.gui.main:main"
hrap-compare = "hrap.cli:compare_main"
hrap-sweep = "hrap.cli:sweep_main"

[project.urls]
Homepage = "https://github.com/sidbanch/HRAP2"

[tool.hatch.build.targets.wheel]
packages = ["src/hrap"]

[tool.hatch.build]
include = [
    "src/hrap/**",
    "LICENSE",
    "README.md",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = [
    "B007",  # loop counters like `it` in chem.py are read after the loop
    "B905",  # zip(strict=) would be noise on paired arrays
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
